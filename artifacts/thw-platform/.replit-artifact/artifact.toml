kind = "mobile"
previewPath = "/"
title = "THW Accounting Platform"
version = "1.0.0"
id = "artifacts/thw-platform"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/" ]
localPort = 20787

[services.development]
run = "pnpm --filter @workspace/thw-platform run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/thw-platform", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/thw-platform", "run", "serve" ]

[services.env]
PORT = "20787"
BASE_PATH = "/"
