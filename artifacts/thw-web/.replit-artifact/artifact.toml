kind = "web"
previewPath = "/oregon-thw-network/"
title = "THW Accounting Platform — Web"
version = "1.0.0"
id = "artifacts/thw-web"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/oregon-thw-network/" ]
localPort = 25448

[services.development]
run = "pnpm --filter @workspace/thw-web run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/thw-web", "run", "build" ]
publicDir = "artifacts/thw-web/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25448"
BASE_PATH = "/oregon-thw-network/"
